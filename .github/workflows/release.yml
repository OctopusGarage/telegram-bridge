name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test
        run: |
          pnpm build
          pnpm test

      - name: Build release package
        run: pnpm run release:package "${GITHUB_REF_NAME}"

      - name: Create release notes and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          PREV_TAG="$(git tag --sort=version:refname --merged "${TAG}^{}" | awk -v tag="${TAG}" '$0 != tag { prev = $0 } $0 == tag { print prev; exit }' || true)"
          CHANGES="$(if [ -n "${PREV_TAG}" ]; then
            git log --no-merges --pretty='- %s' "${PREV_TAG}..${TAG}"
          else
            git log --no-merges --pretty='- %s' "${TAG}"
          fi | sed -E 's/^- release: /- /' )"
          if [ -z "${CHANGES}" ]; then
            CHANGES="- Misc maintenance and packaging updates."
          fi

          {
            echo "Changed"
            echo
            echo "${CHANGES}"
            echo
            echo "One-line install / update:"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${REPO}/main/install.sh | bash"
            echo '```'
            if [ -n "${PREV_TAG}" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV_TAG}...${TAG}"
            fi
          } > release-notes.md

          gh release create "${TAG}" --title "telegram-bridge ${TAG}" --notes-file release-notes.md

          STAGE="telegram-bridge-${TAG}-release"
          gh release upload "${TAG}" \
            "dist/${STAGE}.tar.gz" \
            "dist/${STAGE}.tar.gz.sha256sum" \
            "dist/${STAGE}.zip" \
            "dist/${STAGE}.zip.sha256sum" \
            --clobber
